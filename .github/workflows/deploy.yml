name: Build and publish site

on:
  push:
    branches: [main]
  pull_request:
  # Hourly, because this is the only thing that notices a new release. The
  # site reads `releases/latest` when it builds, so it reports whichever
  # version was newest at that moment: v0.8.1 was published 68 minutes after
  # the 12 Sep build and the site said 0.8.0 for the rest of the day. Once a
  # day is a day of being wrong; once an hour bounds it to an hour. The repo
  # is public, so the runner minutes are free, and a build is under two.
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      source_tag:
        description: 'Published stable release tag (empty selects latest)'
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: site-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Refresh release documentation
        if: github.event_name != 'pull_request'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SOURCE_TAG: ${{ inputs.source_tag }}
        run: npm run docs:sync
      - name: Resolve the demo source
        id: demo
        run: echo "sha=$(node -p "require('./content/upstream/release.json').sha")" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: Arzuparreta/soundsible
          ref: ${{ steps.demo.outputs.sha }}
          path: .demo-source
          persist-credentials: false
      - name: Build the release player when supplied by the release
        run: |
          source=$(mktemp -d "$RUNNER_TEMP/soundsible-source.XXXXXXXX")
          mv .demo-source "$source/release"
          if [[ -f "$source/release/scripts/pages_demo/build.sh" ]]; then
            npm ci --prefix "$source/release/ui_web"
            "$source/release/scripts/pages_demo/build.sh" "$PWD/public/demo"
          fi
      - name: Refresh published Android alpha APK
        run: node scripts/sync-android.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Verify site behavior and source integrity
        run: npm test
      - name: Build, index and check links
        run: npm run build
      - name: Install browser
        run: npx playwright install --with-deps chromium
      - name: Check browser behavior and accessibility
        run: npm run test:browser
      - name: Preserve browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-results
          path: |
            playwright-report/
            test-results/
      - name: Preserve exact documentation inputs
        run: tar -czf documentation-inputs.tar.gz content/upstream content/es
      - uses: actions/upload-artifact@v4
        with:
          name: documentation-inputs
          path: documentation-inputs.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: site-preview
          path: dist/
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          path: dist/

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish validated output
        id: deployment
        uses: actions/deploy-pages@v4
