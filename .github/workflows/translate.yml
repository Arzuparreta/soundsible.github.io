name: Refresh Spanish translations

# The site detects a stale translation precisely and has done nothing about it:
# every Spanish article sat at v0.5.0 while the site served v0.10.0, because
# updating one meant rewriting the whole article and the four manifest fields by
# hand. This job does that work and opens a pull request with it.
#
# It deliberately does not run inside `deploy.yml`. That build is reproducible
# and publishes without review; translations are neither. They arrive here, get
# read, and get merged — the "outdated" notice on the site covers the gap.
on:
  schedule:
    - cron: '43 5 * * *'
  workflow_dispatch:
    inputs:
      slug:
        description: 'One document to refresh (empty refreshes every stale one)'
        type: string
        required: false
      force:
        description: 'Retranslate even documents whose English has not changed'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: translations
  cancel-in-progress: false

jobs:
  translate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci

      - name: Import the current release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: npm run docs:sync

      # No key is a normal state, not a broken one. Say so and stop, rather than
      # painting the repository red every morning. The day a key appears this
      # starts working with no further change.
      - name: Check for a key
        id: key
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "${ANTHROPIC_API_KEY:-}" ]; then
            echo "::warning::ANTHROPIC_API_KEY is unset, so translations were not refreshed. Spanish articles keep their outdated notice on the site."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      # Free: it reads the snapshot and the manifest, and calls nothing.
      - name: Is anything stale?
        id: plan
        if: steps.key.outputs.ready == 'true'
        run: |
          set -euo pipefail
          npm run --silent translate -- --all --dry-run | tee plan.txt
          if grep -qE '^[a-z0-9-]+: (outdated|missing)' plan.txt; then
            echo "stale=true" >> "$GITHUB_OUTPUT"
          else
            echo "stale=false" >> "$GITHUB_OUTPUT"
            echo "Every Spanish article already matches the imported release."
          fi

      - name: Translate what changed
        id: translate
        if: >-
          steps.key.outputs.ready == 'true' &&
          (steps.plan.outputs.stale == 'true' || inputs.slug != '' || inputs.force)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SLUG: ${{ inputs.slug }}
          FORCE: ${{ inputs.force }}
        run: |
          set -euo pipefail
          arguments=(--all)
          if [ -n "${SLUG:-}" ]; then
            arguments=(--slug "$SLUG")
          fi
          if [ "${FORCE:-false}" = "true" ]; then
            arguments+=(--force)
          fi
          npm run translate -- "${arguments[@]}"

      # A pull request opened with GITHUB_TOKEN does not start other workflows,
      # so `deploy.yml` will not check this branch. Check it here instead, and
      # never open a pull request that does not build.
      - name: Verify the translations
        if: steps.translate.outcome == 'success'
        run: |
          npm test
          npm run build

      - name: Open or update the pull request
        if: steps.translate.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="$(node -p "require('./content/upstream/release.json').tag")"
          branch="chore/translations-${tag}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content
          if git diff --cached --quiet; then
            echo "Nothing changed on disk; no pull request needed."
            exit 0
          fi
          git checkout -b "$branch"
          git commit -m "chore: refresh the Spanish translations for ${tag}"
          git push --force-with-lease --set-upstream origin "$branch"
          if [ -n "$(gh pr list --head "$branch" --state open --json number --jq '.[].number')" ]; then
            echo "Updated the open pull request for $branch."
            exit 0
          fi
          {
            echo "Regenerated by \`scripts/translate.mjs\` from the ${tag} snapshot."
            echo
            echo "Only the blocks whose English changed were retranslated; everything else keeps the Spanish it already had, so the diff is the change."
            echo
            echo '```'
            cat plan.txt
            echo '```'
            echo
            echo "\`npm test\` and \`npm run build\` passed on this branch before it was opened — a pull request from \`GITHUB_TOKEN\` does not start the deploy workflow, so those checks ran in the translation job instead."
            echo
            echo "Terminology comes from \`content/es/glossary.md\`. Correct that file and rerun this workflow to apply it everywhere with \`force\`."
          } > body.md
          gh pr create --base main --head "$branch" \
            --title "Refresh the Spanish translations for ${tag}" \
            --body-file body.md
